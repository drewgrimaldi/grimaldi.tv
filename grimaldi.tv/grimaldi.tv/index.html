  <!-- SEAMLESS CROSS-SUBDOMAIN (.GRIMALDI.TV) AUTH SYNC -->
  <div id="grimaldiAuthModal" style="position:fixed; inset:0; z-index:1000000; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; padding:20px; font-family:system-ui, -apple-system, sans-serif;">
    <div style="max-width:420px; width:100%; background:#121212; border:1px solid rgba(59,130,246,0.4); border-radius:24px; padding:28px 24px; color:white; box-shadow:0 12px 40px rgba(0,0,0,0.9); text-align:center; position:relative;">
      <button onclick="window.closeGrimaldiAuthModal()" style="position:absolute; top:16px; right:16px; background:none; border:none; color:#a1a1aa; font-size:24px; cursor:pointer; line-height:1;">&times;</button>
      
      <div style="width:56px; height:56px; border-radius:50%; background:rgba(59,130,246,0.15); display:flex; align-items:center; justify-content:center; margin:0 auto 14px auto; font-size:28px;">🔑</div>
      <h3 style="font-size:22px; font-weight:900; letter-spacing:0.04em; text-transform:uppercase; margin:0 0 6px 0; color:#ffffff;">SUBSCRIBER SIGN-IN</h3>
      <p style="color:#a1a1aa; font-size:13px; line-height:1.5; margin:0 0 20px 0;">Sign in with your registered <strong>Username</strong> or <strong>Email</strong> to unlock all Blog posts, Photo Galleries, and VIP Analysis across all Grimaldi TV sites.</p>

      <form onsubmit="window.handleGrimaldiSignIn(event)" style="display:flex; flex-direction:column; gap:12px;">
        <input type="text" id="grimaldiAuthInput" placeholder="Username or Email" required style="width:100%; padding:14px 16px; background:#1c1c1e; border:1px solid #333; border-radius:12px; color:white; font-size:14px; outline:none; box-sizing:border-box;" />
        <input type="password" id="grimaldiAuthPassword" placeholder="Password" required style="width:100%; padding:14px 16px; background:#1c1c1e; border:1px solid #333; border-radius:12px; color:white; font-size:14px; outline:none; box-sizing:border-box;" />
        <div id="grimaldiAuthError" style="display:none; color:#ef4444; font-size:12px; text-align:left; line-height:1.4;"></div>

        <button type="submit" id="grimaldiAuthSubmitBtn" style="width:100%; padding:14px; background:linear-gradient(135deg, #2563eb, #3b82f6); color:white; font-weight:900; font-size:14px; border:none; border-radius:30px; cursor:pointer; text-transform:uppercase; letter-spacing:0.04em; box-shadow:0 6px 20px rgba(37,99,235,0.4);">
          Sign In & Unlock All
        </button>
      </form>
    </div>

  <script>
    (function() {
      const DOMAIN_COOKIE = "grimaldi_sub";

      // Define global window.isGrimaldiVip helper for blog & photo paywall unlock
      window.isGrimaldiVip = function() {
        try {
          const email = localStorage.getItem('dgp_subscriber_email') || 
                        localStorage.getItem('grimaldi_subscriber') || 
                        localStorage.getItem('patriot_subscriber') || 
                        localStorage.getItem('samPremiumAccess');
          const cookieStr = document.cookie || '';
          const hasCookie = cookieStr.includes('grimaldi_sub=') || cookieStr.includes('samPremiumAccess');
          return !!(email || hasCookie);
        } catch(e) {
          return false;
        }
      };

      // Read root domain cookie
      function getRootCookie() {
        const nameEQ = DOMAIN_COOKIE + "=";
        const ca = document.cookie.split(';');
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i].trim();
          if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
        }
        return null;
      }

      // Set root domain cookie (.grimaldi.tv)
      function setRootCookie(usernameOrEmail) {
        if (!usernameOrEmail) return;
        const expires = "Max-Age=31536000; "; // 1 year
        const domainStr = window.location.hostname.includes('grimaldi.tv') ? "Domain=.grimaldi.tv; " : "";
        document.cookie = DOMAIN_COOKIE + "=" + encodeURIComponent(usernameOrEmail) + "; " + expires + domainStr + "Path=/; SameSite=Lax";
      }

      // Clear root domain cookie
      function clearRootCookie() {
        const domainStr = window.location.hostname.includes('grimaldi.tv') ? "Domain=.grimaldi.tv; " : "";
        document.cookie = DOMAIN_COOKIE + "=; Max-Age=0; " + domainStr + "Path=/;";
      }

      // Sync all localStorage keys
      function syncAllAuthKeys(usernameOrEmail) {
        if (!usernameOrEmail) return;
        localStorage.setItem('dgp_subscriber_email', usernameOrEmail);
        localStorage.setItem('samPremiumAccess', 'true');
        localStorage.setItem('grimaldi_subscriber', usernameOrEmail);
        localStorage.setItem('patriot_subscriber', 'true');
        setRootCookie(usernameOrEmail);
      }

      function clearAllAuthKeys() {
        localStorage.removeItem('dgp_subscriber_email');
        localStorage.removeItem('samPremiumAccess');
        localStorage.removeItem('grimaldi_subscriber');
        localStorage.removeItem('patriot_subscriber');
        clearRootCookie();
      }

      function getValidUserString(val) {
        if (!val || typeof val !== 'string') return null;
        const clean = val.trim();
        if (clean === '' || clean === 'true' || clean === 'false' || clean === 'null' || clean === 'undefined') return null;
        return clean;
      }

      function getActiveUser() {
        return getValidUserString(localStorage.getItem('dgp_subscriber_email')) || 
               getValidUserString(localStorage.getItem('grimaldi_subscriber')) || 
               getValidUserString(getRootCookie());
      }

      // 1. Check URL parameters for cross-domain auth
      const urlParams = new URLSearchParams(window.location.search);
      const authParam = urlParams.get('subscriber') || urlParams.get('auth');
      if (getValidUserString(authParam)) {
        syncAllAuthKeys(authParam);
        const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        window.history.replaceState({path: cleanUrl}, '', cleanUrl);
      }

      // 2. Check root domain cookie and local subscriber state on startup
      const activeUser = getActiveUser();
      if (activeUser) {
        syncAllAuthKeys(activeUser);
      } else {
        clearAllAuthKeys();
      }

      // 3. Dynamic URL Link Sync (appends ?auth=user to all cross-subdomain links)
      function updateCrossDomainLinks() {
        const user = getActiveUser();
        if (!user) return;

        const links = document.querySelectorAll('a[href*="grimaldi.tv"]');
        links.forEach(link => {
          try {
            const linkUrl = new URL(link.href);
            if (!linkUrl.searchParams.has('auth')) {
              linkUrl.searchParams.set('auth', user);
              link.href = linkUrl.toString();
            }
          } catch(e){}
        });
      }

      function addDrawerAuthLink() {
        const navDiv = document.querySelector('aside .px-5.py-6.flex.flex-col') || 
                       document.querySelector('aside div.flex.flex-col') ||
                       document.querySelector('aside nav');

        const currentUser = getActiveUser();
        updateCrossDomainLinks();

        if (navDiv && !document.getElementById('grimaldi-menu-auth-link')) {
          const a = document.createElement('a');
          a.id = 'grimaldi-menu-auth-link';
          a.className = 'relative px-4 py-3 grit-nav-link border-t border-white/10 mt-2';
          a.style.cssText = 'color: #3b82f6 !important; font-weight: 700 !important; cursor: pointer; text-decoration: none; display: block; font-family: Oswald, Anton, Impact, sans-serif !important; text-transform: uppercase; font-size: 16px; letter-spacing: 0.08em;';
          
          if (currentUser) {
            a.innerHTML = 'SIGN OUT (' + currentUser.split('@')[0] + ')';
            a.style.setProperty('color', '#ef4444', 'important');
            a.onclick = function(e) {
              e.preventDefault();
              clearAllAuthKeys();
              window.location.reload();
            };
          } else {
            a.innerHTML = 'SIGN IN / SIGN OUT';
            a.onclick = function(e) {
              e.preventDefault();
              window.openGrimaldiAuthModal();
            };
          }
          navDiv.appendChild(a);
        } else if (document.getElementById('grimaldi-menu-auth-link')) {
          const a = document.getElementById('grimaldi-menu-auth-link');
          if (currentUser && !a.innerHTML.includes('SIGN OUT')) {
            a.innerHTML = 'SIGN OUT (' + currentUser.split('@')[0] + ')';
            a.style.setProperty('color', '#ef4444', 'important');
            a.onclick = function(e) {
              e.preventDefault();
              clearAllAuthKeys();
              window.location.reload();
            };
          } else if (!currentUser && !a.innerHTML.includes('SIGN IN')) {
            a.innerHTML = 'SIGN IN / SIGN OUT';
            a.style.setProperty('color', '#3b82f6', 'important');
            a.onclick = function(e) {
              e.preventDefault();
              window.openGrimaldiAuthModal();
            };
          }
        }
      }

      window.openGrimaldiAuthModal = function() {
        const modal = document.getElementById('grimaldiAuthModal');
        if (modal) modal.style.display = 'flex';
      };

      window.closeGrimaldiAuthModal = function() {
        const modal = document.getElementById('grimaldiAuthModal');
        if (modal) modal.style.display = 'none';
      };

      window.handleGrimaldiSignIn = async function(e) {
        e.preventDefault();
        const input = document.getElementById('grimaldiAuthInput');
        const passInput = document.getElementById('grimaldiAuthPassword');
        const err = document.getElementById('grimaldiAuthError');
        const btn = document.getElementById('grimaldiAuthSubmitBtn');

        const val = (input ? input.value : "").trim();
        const pass = (passInput ? passInput.value : "").toString();
        if (!val || !pass) {
          if (err) {
            err.textContent = "❌ Please enter both username/email and password.";
            err.style.display = 'block';
          }
          return;
        }

        if (btn) { btn.disabled = true; btn.textContent = "Verifying..."; }
        if (err) err.style.display = 'none';

        try {
          const res = await fetch("https://ai.grimaldi.tv/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ username: val, password: pass })
          });

          const data = await res.json();

          if (res.ok && data && data.ok) {
            const matchedName = data.username || val;
            syncAllAuthKeys(matchedName);
            window.closeGrimaldiAuthModal();
            window.location.reload();
            return;
          } else {
            if (err) {
              err.textContent = "❌ " + ((data && data.error) ? data.error : "Incorrect username/email or password.");
              err.style.display = 'block';
            }
            if (btn) { btn.disabled = false; btn.textContent = "Sign In & Unlock All"; }
            return;
          }
        } catch (errEv) {
          if (err) {
            err.textContent = "❌ Authentication service unavailable. Please check your credentials and try again.";
            err.style.display = 'block';
          }
          if (btn) { btn.disabled = false; btn.textContent = "Sign In & Unlock All"; }
        }
      };

      setInterval(addDrawerAuthLink, 250);
    })();
  </script>
